[workspace]
resolver = "2"
members = [
    "claude-starship",
    "claude-metric",
    "claude-starship-common",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mergeconflict/claude-starship"
description = "Integrate Claude Code session metrics into Starship shell prompt"
keywords = ["claude", "starship", "prompt", "cli"]
categories = ["command-line-utilities"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that pedantic flags
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
jiff = "0.2"
claude-starship-common = { path = "claude-starship-common" }
